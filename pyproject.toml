[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[project]
name = "compiledb"
dynamic = ["version"]
description = "Tool for generating Clang JSON Compilation Database files for make-based build systems."
license-files = ["LICENSE"]
authors = [
  { name = "Nick Yamane", email = "nickdiego@igalia.com" },
  { name = "Koichi Shiraishi", email = "zchee.io@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
  "bashlex>=0.18",
  "click>=8.3.3",
  "orjson>=3.11.9",
]
readme = "README.md"
keywords = [
  "compilation-database",
  "clang",
  "c",
  "cpp",
  "makefile",
  "make",
  "language-server",
  "lsp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/zchee/compiledb.git"
Issues = "https://github.com/zchee/compiledb/issues"

[project.scripts]
compiledb = "compiledb.cli:cli"

[project.optional-dependencies]
dev = [
  "ruff",
  "ty",
  "pytest",
  "coverage",
  "pytest-cov",
]

[tool.ruff]
target-version = "py314"
line-length = 120
preview = true
unsafe-fixes = true

[tool.ruff.lint]
fixable = ["ALL"]
preview = true

select = [
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "D101", # pydocstyle/undocumented-public-class
  "D102", # pydocstyle/undocumented-public-method
  "D103", # pydocstyle/undocumented-public-function
  "E", # pycodestyle (Error)
  "F", # Pyflakes
  "I", # isort
  "INP001", # flake8-no-pep420/implicit-namespace-package
  "N", # pep8-naming
  "SIM", # flake8-simplify
  "TD002", # flake8-todos/missing-todo-author
  "TD006", # flake8-todos/invalid-todo-capitalization
  "TID", # flake8-tidy-imports
  "UP", # pyupgrade
  "W", # pycodestyle (Warning)
  "ANN", # flake8-annotations
  "RUF", # Ruff-specific rules
  "PIE", # flake8-pie
  "LOG", # flake8-logging
]

ignore = [
  "RUF001", # ambiguous-unicode-character-string
  "RUF003", # ambiguous-unicode-character-comment
  "RUF067", # __init__ contains implementation for this legacy package
  "ANN", # defer full annotation enforcement until a dedicated typing pass
  "ANN401", # any-type
  "B008", # legacy default cwd capture retained for compatibility
  "B904", # preserve existing exception chaining behavior for now
  "D101", # defer public class docstring enforcement
  "D102", # defer public method docstring enforcement
  "D103", # defer public function docstring enforcement
  # ruff formatter recommends to disable those. see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "COM812", # Trailing comma missing
  "COM819", # Trailing comma prohibited
  "D206", # Docstring should be indented with spaces, not tabs
  "D300", # Use triple double quotes """
  "E111", # Indentation is not a multiple of
  "E114", # Indentation is not a multiple of {indent_size} (comment)
  "E117", # Over-indented (comment)
  "E203", # Whitespace before '{symbol}'
  "E501", # Line too long ({width} > {limit})
  "ISC001", # Implicitly concatenated string literals on one line
  "ISC002", # Implicitly concatenated string literals over multiple lines
  "Q000", # Single quotes found but double quotes preferred
  "Q001", # Single quote multiline found but double quotes preferred
  "Q002", # Single quote docstring found but double quotes preferred
  "Q003", # Change outer quotes to avoid escaping inner quotes
  "W191", # Indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402", "D101", "D102", "D103"]

[tool.ruff.format]
preview = true
quote-style = "double"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
include = ["compiledb", "tests"]
